[project]
name = "sonara"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Annette Sachs", email = "asachs25@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "librosa>=1.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opensmile>=2.6.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
sonara = "sonara:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
